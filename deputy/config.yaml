name: "Deputy"
version: 0.13.0
slug: "deputy"
description: "WANTED control plane — manage Sheriff edge devices, with HA MQTT Discovery"
url: "https://gitlab.com/mekops/wanted/deputy"
image: "ghcr.io/mekops-labs/deputy"
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false

# Twin database, layer cache, and the persisted signing seed live in /data
# (the Supervisor's per-add-on persistent volume)

services:
  - mqtt:want

# Sheriff devices reach the device-protocol port directly (direct-CBOR
# framing). The REST API is left unmapped by default — mapping it is an
# opt-in that hands the whole control plane to whoever holds the api_token.
ports:
  8080/tcp: null
  8081/tcp: 8081

ports_description:
  8080/tcp: "REST API — unmapped by default; map it to drive this Deputy from a CLI or CI, and note the api_token"
  8081/tcp: "Sheriff device protocol (direct CBOR)"

# The web UI rides the HTTP listener; ingress serves it in the HA sidebar.
ingress: true
ingress_port: 8080
panel_icon: "mdi:police-badge"
panel_title: "Deputy"

options:
  sync_interval_s: 60
  oci_insecure: false
  mqtt_client_id: "deputy"
  mqtt_insecure: false

schema:
  # Device reconciliation cadence pushed in every desired state.
  sync_interval_s: int(1,3600)
  # Allow plain-HTTP OCI registries (local registries without TLS).
  oci_insecure: bool
  # Hex Ed25519 seed (64 chars). Leave unset to auto-generate once and persist
  # in /data — the derived pubkey must stay stable or provisioned devices
  # reject every desired state.
  signing_seed: password?
  # Bearer token for the REST API. Leave unset to auto-generate one into
  # /data and log it at startup; the sidebar never needs it, a CLI or CI
  # pushing to a mapped 8080 does.
  api_token: password?
  # OCI registry credentials for image resolution and layer pre-caching.
  oci_username: str?
  oci_password: password?
  oci_bearer: password?
  # Self-hosted MQTT broker (e.g. tcp://host:1883), overriding the internal
  # Home Assistant MQTT service auto-discovery below. Leave unset to use the
  # Mosquitto broker add-on instead.
  mqtt_broker: str?
  mqtt_username: str?
  mqtt_password: password?
  # Give each Deputy its own client id when several share a broker (defaults
  # to a fixed id, which a second connection would evict from the broker).
  mqtt_client_id: str?
  # PEM bundle verifying the broker certificate, for a broker behind a
  # private CA. Unset uses the system trust store.
  mqtt_ca_cert: str?
  # Accept any broker certificate. Lab use only — this drops the guarantee
  # that the broker is the one intended.
  mqtt_insecure: bool
  # This Deputy's address, written into an issued provisioning blob's
  # manager field. Left for the operator to fill in when unset.
  manager_address: str?
  # The OCI registry's address, written into an issued provisioning blob's
  # registry field and defaulted onto a hostless image ref. Left for the
  # operator to fill in either way when unset.
  registry_address: str?
